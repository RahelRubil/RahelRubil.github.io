   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Growth Marketer Portfolio</title>
  
   <!-- Google Fonts -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">


   <style>
       * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
       }


       body {

           background-color: #18191b;
           color: #e5e2da;
           font-family: 'Italiana', 'Playfair Display', serif;
           min-height: 100vh;
           display: flex;
           flex-direction: column;
           justify-content: center; /* Centrerar huvudinnehållet vertikalt */
           align-items: center;     /* Centrerar huvudinnehållet horisontellt */
           position: relative;
           overflow-x: hidden;
       }


       /* Header högst upp */
       header {
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding: 35px 50px;
           z-index: 10;
       }


       .logo {
           font-family: 'Plus Jakarta Sans', sans-serif;
           font-size: 0.85rem;
           font-weight: 500;
           letter-spacing: 1px;
           line-height: 1.2;
           text-transform: uppercase;
           color: #e5e2da;
       }


       .menu-btn {
           display: flex;
           flex-direction: column;
           gap: 6px;
           cursor: pointer;
       }


       .menu-btn span {
           display: block;
           width: 28px;
           height: 1.5px;
           background-color: #e5e2da;
       }


       /* Centrerat huvudinnehåll */
       main {
           text-align: center;
           padding: 0 20px;
           width: 100%;
       }


       .hero-title {
           font-size: clamp(3rem, 7.5vw, 7rem);
           line-height: 0.95;
           letter-spacing: 2px;
           text-transform: uppercase;
           font-weight: 400;
           color: #e5e2da;
       }


       .title-italic {
           font-family: 'Playfair Display', serif;
           font-style: italic;
           text-transform: lowercase;
           font-weight: 400;
           letter-spacing: 0px;
       }


       /* Sidobadge i nedre högra hörnet */
       .side-badge {
           position: fixed;
           right: 0;
           bottom: 0;
           background-color: #7fc8c5;
           color: #18191b;
           padding: 15px 10px;
           display: flex;
           flex-direction: column;
           align-items: center;
           gap: 15px;
           font-family: 'Plus Jakarta Sans', sans-serif;
           border-top-left-radius: 4px;
           z-index: 100;
       }


       .side-badge .w-logo {
           font-weight: 800;
           font-size: 1.3rem;
           line-height: 1;
       }


       .side-badge .badge-text {
           writing-mode: vertical-rl;
           transform: rotate(180deg);
           font-size: 0.7rem;
           font-weight: 600;
           letter-spacing: 1px;
           text-transform: uppercase;
       }
   </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K6HRJG7H"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

   <!-- Header med bild och namn -->
   <header>
       <div class="logo" style="display: flex; align-items: center; gap: 12px;">
           <img src="min-bild.jpg" style="height: 85px; width: 85px; border-radius: 50%; object-fit: cover;">
           <div>RAHEL RUBIL<br>GROWTH MARKETER</div>
       </div>
       <div class="menu-btn">
           <span></span>
           <span></span>
       </div>
   </header>


   <!-- Exakt centrerad rubrik -->
   <main>
       <h1 class="hero-title">
           GROWTH<br>
           MARKETER<br>
           <span class="title-italic">in the making</span>
       </h1>
   </main>


   <!-- Sidobadge längst ner till höger -->
   <div class="side-badge">
       <span class="w-logo">W.</span>
       <span class="badge-text">Honors</span>
   </div>


</body>
</html>
